            return String(str ?? '')

                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

        function extractNumericSerNo(serNo) {
            const digits = String(serNo || '').replace(/\D/g, '');

        function sortNominalRoll(list) {
            return [...list].map(u => ({
                ...u,
                branch: normalizeBranchName(u.branch),
                rank: normalizeRankName(u.rank)
            })).sort((a, b) => {
                const idxA = STANDARD_BRANCHES.indexOf(a.branch);
                const idxB = STANDARD_BRANCHES.indexOf(b.branch);
                const orderA = idxA === -1 ? 999 : idxA;
                const orderB = idxB === -1 ? 999 : idxB;

                if (orderA !== orderB) {
                    return orderA - orderB;
                }
                if (a.branch !== b.branch) {
                    return a.branch.localeCompare(b.branch);
                }
                const numA = extractNumericSerNo(a.serviceNo);
                const numB = extractNumericSerNo(b.serviceNo);
                if (numA !== numB) {
                    return numA - numB;
                }
                return String(a.serviceNo).localeCompare(String(b.serviceNo));
            });
        }

                    const buf = await window.crypto.subtle.digest('SHA-256', enc);
                    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                }
            } catch (e) { /* fallback below */ }
            return 'plain_' + String(pinText || '');
        }

        function getSupabaseClient() {
            if (!romsSupabaseClient && typeof window.supabase !== 'undefined') {
                romsSupabaseClient = window.supabase.createClient(ROMS_SUPABASE_CONFIG.url, ROMS_SUPABASE_CONFIG.anonKey);
            }
            return romsSupabaseClient;
        }

        function saveLocalCacheOnly() {
            state.nominalRoll = sortNominalRoll(state.nominalRoll);
            localStorage.setItem('ops3_nominal', JSON.stringify(state.nominalRoll));
            localStorage.setItem('ops3_report', JSON.stringify(state.report));
            localStorage.setItem('ops3_seen', JSON.stringify(state.seenLogs));
            localStorage.setItem('ops3_notices', JSON.stringify(state.specialNotices));
            localStorage.setItem('ops3_audit', JSON.stringify(state.auditLogs));
        }

        async function syncStateToSupabase() {
            const client = getSupabaseClient();
            if (!client || isPullingFromCloud) return;

            try {
                state.cloudStatus = 'Syncing...';
                state.cloudErrorDetail = '';
                render();

                // 1. Sync main report
                const { error: repErr } = await client.from('daily_reports').upsert({
                    id: 'main_report',
                    report_data: state.report,
                    updated_at: new Date().toISOString()
                });
                if (repErr) throw repErr;

                // 2. Sync nominal roll (also delete removed users)
                const nominalRows = await Promise.all(state.nominalRoll.map(async (u) => ({
                    id: u.id,
                    service_no: u.serviceNo,
                    rank: u.rank,
                    full_name: u.name,
                    branch: u.branch,
                    phone1: u.phone1 || '',
                    phone2: u.phone2 || '',
                    whatsapp: u.whatsapp || '',
                    pin_hash: await hashPinSHA256(u.pin),
                    role: u.role || 'officer',
                    status: u.status || 'Active',
                    updated_at: new Date().toISOString()
                })));
                if (nominalRows.length > 0) {
                    const { error: nomErr } = await client.from('nominal_roll').upsert(nominalRows);
                    if (nomErr) throw nomErr;
                }

                // 3. Sync seen logs
                const seenRows = state.seenLogs.map(s => ({
                    user_id: s.userId,
                    seen_time: s.time,
                    remark: s.remark || '',
                    updated_at: new Date().toISOString()
                }));
                if (seenRows.length > 0) {
                    const { error: seenErr } = await client.from('seen_logs').upsert(seenRows);
                    if (seenErr) throw seenErr;
                }

                // 4. Sync special notices
                const noticeRows = state.specialNotices.map(n => ({
                    id: n.id,
                    notice_data: n,
                    created_at: new Date().toISOString()
                }));
                if (noticeRows.length > 0) {
                    const { error: notErr } = await client.from('special_notices').upsert(noticeRows);
                    if (notErr) throw notErr;
                }

                // 5. Sync latest audit logs
                const auditRows = state.auditLogs.slice(0, 100).map(a => ({
                    id: a.id,
                    log_time: a.time,
                    actor: a.user,
                    mode_label: a.mode,
                    action_text: a.action,
                    created_at: new Date().toISOString()
                }));
                if (auditRows.length > 0) {
                    const { error: audErr } = await client.from('audit_logs').upsert(auditRows);
                    if (audErr) throw audErr;
                }

                state.cloudStatus = 'Cloud Synced ✓';
                render();
            } catch (err) {
                console.error('Supabase Sync Error:', err);
                state.cloudStatus = 'Sync Error';
                state.cloudErrorDetail = err?.message || 'RLS Policy හෝ API Key පරීක්ෂා කරන්න.';
                showToast('Cloud Sync දෝෂය: ' + state.cloudErrorDetail, 'error');
                render();
            }
        }

        async function pullInitialCloudState(silent = false) {
            const client = getSupabaseClient();
            if (!client) {
                state.cloudStatus = 'Offline Mode';
                render();
                return;
            }
            try {
                isPullingFromCloud = true;

                // 1. Pull daily_reports
                const { data: repRows, error: repErr } = await client
                    .from('daily_reports')
                    .select('report_data')
                    .eq('id', 'main_report')
                    .maybeSingle();

                if (repErr) throw repErr;

                if (repRows && repRows.report_data) {
                    state.report = {
                        ...DEFAULT_REPORT,
                        ...repRows.report_data,
                        keyDutyHeads: { ...DEFAULT_REPORT.keyDutyHeads, ...(repRows.report_data.keyDutyHeads || {}) },
                        parade: { ...DEFAULT_REPORT.parade, ...(repRows.report_data.parade || {}) }
                    };
                } else {
                    // First time setup: push initial report to empty cloud table
                    isPullingFromCloud = false;
                    await syncStateToSupabase();
                    return;
                }

                // 2. Pull nominal_roll
                const { data: nomRows, error: nomErr } = await client.from('nominal_roll').select('*');
                if (nomErr) throw nomErr;
                if (Array.isArray(nomRows) && nomRows.length > 0) {
                    const localPinMap = new Map(state.nominalRoll.map(u => [u.id, u.pin]));
                    state.nominalRoll = sortNominalRoll(nomRows.map(r => ({
                        id: r.id,
                        serviceNo: r.service_no,
                        rank: r.rank,
                        name: r.full_name,
                        branch: r.branch,
                        phone1: r.phone1 || '',
                        phone2: r.phone2 || '',
                        whatsapp: r.whatsapp || '',
                        pin: localPinMap.get(r.id) || '',
                        pinHash: r.pin_hash,
                        role: r.role || 'officer',
                        status: r.status || 'Active'
                    })));
                }

                // 3. Pull seen_logs
                const { data: seenRows, error: seenErr } = await client.from('seen_logs').select('*');
                if (!seenErr && Array.isArray(seenRows)) {
                    state.seenLogs = seenRows.map(s => ({
                        userId: s.user_id,
                        time: s.seen_time,
                        remark: s.remark || ''
                    }));
                }

                // 4. Pull special_notices
                const { data: noticeRows, error: notErr } = await client.from('special_notices').select('notice_data');
                if (!notErr && Array.isArray(noticeRows) && noticeRows.length > 0) {
                    state.specialNotices = noticeRows.map(n => n.notice_data);
                }

                // 5. Pull audit_logs
                const { data: auditRows, error: audErr } = await client
                    .from('audit_logs')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(100);
                if (!audErr && Array.isArray(auditRows) && auditRows.length > 0) {
                    state.auditLogs = auditRows.map(a => ({
                        id: a.id,
                        time: a.log_time,
                        user: a.actor,
                        mode: a.mode_label,
                        action: a.action_text
                    }));
                }

                saveLocalCacheOnly();
                state.cloudStatus = 'Cloud Live ●';
                state.cloudErrorDetail = '';
                isPullingFromCloud = false;
                render();
                if (!silent) {
                    showToast('Cloud දත්ත යාවත්කාලීන විය!', 'success');
                }
            } catch (err) {
                isPullingFromCloud = false;
                console.error('Supabase Pull Error:', err);
                state.cloudStatus = 'Sync Error';
                state.cloudErrorDetail = err?.message || 'Supabase RLS / Key දෝෂයකි.';
                render();
            }
        }

        function setupRealtimeSubscription() {
            const client = getSupabaseClient();
            if (!client) return;
            try {
                client
                    .channel('roms-live-updates')
                    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
                        if (!isPullingFromCloud) {
                            pullInitialCloudState(true);
                        }
                    })
                    .subscribe();
            } catch (e) {
                console.warn('Realtime fallback active');
            }
        }

        function getFormattedOrdinalDate(dateObj = new Date()) {
            const day = dateObj.getDate();
            const suffix = (day % 10 === 1 && day !== 11) ? 'st'
                : (day % 10 === 2 && day !== 12) ? 'nd'
                : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return `${day}${suffix} of ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        }

            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        // ==========================================
        function generateQRSVG(seedText, color = '#0f172a') {
            let hash = 0;
            for (let i = 0; i < seedText.length; i++) {
                hash = ((hash << 5) - hash) + seedText.charCodeAt(i);
                hash |= 0;
            }
            const size = 21;
            let cells = '';
            const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (isFinder(r, c)) continue;
                    const val = Math.abs(Math.sin(hash + r * 29 + c * 13));
                    if (val > 0.47) {
                        cells += `<rect x="${c + 2}" y="${r + 2}" width="1" height="1" fill="${color}" rx="0.15"/>`;
                    }
                }
            }
            const finder = (x, y) => `
                <rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="${color}" stroke-width="1"/>
                <rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="${color}"/>
            `;
            return `
                <svg viewBox="0 0 25 25" class="w-36 h-36 mx-auto bg-white p-2 rounded-xl border-2 border-slate-200 shadow-inner">
                    ${finder(2.5, 2.5)}${finder(15.5, 2.5)}${finder(2.5, 15.5)}${cells}
                </svg>
            `;
        }

        async function verifyPinLogin() {
            let user = null;
            const enteredHash = await hashPinSHA256(state.pinBuffer);

            if (state.selectedLoginUserId) {
                const candidate = getUserById(state.selectedLoginUserId);
                if (candidate && (candidate.pin === state.pinBuffer || (candidate.pinHash && candidate.pinHash === enteredHash))) {
                    user = candidate;
                }
            } else {
                user = state.nominalRoll.find(u => u.pin === state.pinBuffer || (u.pinHash && u.pinHash === enteredHash));
            }

            if (!user) {
                showToast('වැරදි PIN අංකයකි! නැවත උත්සාහ කරන්න.', 'error');
                state.pinBuffer = '';
                render();
                return;

            if (user.status !== 'Active') {

                state.pinBuffer = '';
                render();
                return;
            }

            const effectiveMode = (user.role === 'admin' && state.selectedQrMode === 'admin') ? 'admin' : state.selectedQrMode;

                duty: 'Duty Handover QR',

        function saveSpecialAlert(isActive) {
            const title = document.getElementById('alert-title-input')?.value.trim() || '';
            const message = document.getElementById('alert-msg-input')?.value.trim() || '';
            const user = state.session.user;

            if (isActive && (!title || !message)) {
                showToast('මාතෘකාව සහ පණිවිඩය ඇතුළත් කරන්න.', 'warning');
                return;
            }

            state.report.specialAlert = {
                active: isActive,
                title,
                message,
                postedBy: `${user.rank} ${user.name}`,
                time: getCurrentTimeStr()
            };

            logAudit(user, 'Special Alert', isActive ? `සැමට පෙනෙන විශේෂ Alert එකක් පළ කළේය: "${title}"` : 'Special Alert ඉවත් කළේය.');
            saveState();
            closeModal();
            showToast(isActive ? 'විශේෂ Alert එක සැමට පෙනෙන පරිදි පළ විය!' : 'Alert එක ඉවත් කරන ලදී.', isActive ? 'warning' : 'info');

        function toggleAllNoticeRecipients(checked) {
            document.querySelectorAll('input[name="sn-recipient"]').forEach(cb => cb.checked = checked);
        }

        function selectRecipientsByBranch(branch) {
            document.querySelectorAll('input[name="sn-recipient"]').forEach(cb => {
                if (branch === 'ALL') {
                    cb.checked = true;
                } else {
                    cb.checked = (cb.getAttribute('data-branch') === branch);
                }
            });
        }

        function submitNewSpecialNotice() {
            const title = document.getElementById('sn-title').value.trim();
            const message = document.getElementById('sn-body').value.trim();
            const selectedIds = Array.from(document.querySelectorAll('input[name="sn-recipient"]:checked')).map(cb => cb.value);

            if (!title || !message) {
                showToast('පණිවිඩයේ මාතෘකාව සහ විස්තරය ඇතුළත් කරන්න.', 'warning');
                return;
            }
            if (selectedIds.length === 0) {
                showToast('අවම වශයෙන් එක් නිලධාරියෙකු හෝ තෝරන්න.', 'warning');
                return;
            }

            const sender = state.session.user;
            const newNotice = {
                id: 'sn_' + Date.now(),
                title,
                message,
                senderId: sender.id,
                senderName: `${sender.rank} ${sender.name}`,
                createdAt: getCurrentTimeStr(),
                recipientIds: selectedIds,
                responses: []
            };

            state.specialNotices.unshift(newNotice);
            logAudit(sender, 'Special Notice', `නිලධාරීන් ${selectedIds.length} දෙනෙකුට විශේෂ පණිවිඩයක් යවන ලදී: "${title}"`);
            saveState();
            closeModal();
            showToast(`තෝරාගත් ${selectedIds.length} දෙනාට පණිවිඩය යවන ලදී!`, 'success');
            render();
        }

        function submitNoticeResponse(noticeId) {
            const notice = state.specialNotices.find(n => n.id === noticeId);
            if (!notice) return;

            const statusEl = document.getElementById(`resp-status-${noticeId}`);
            const textEl = document.getElementById(`resp-text-${noticeId}`);
            const statusVal = statusEl.value;
            const replyText = textEl.value.trim();

            if (!replyText) {
                showToast('ඔබ ගත් ක්‍රියාමාර්ගය හෝ පිළිතුර Type කරන්න.', 'warning');
                return;
            }

            const user = state.session.user;
            const existingIdx = notice.responses.findIndex(r => r.userId === user.id);
            const respObj = {
                userId: user.id,
                status: statusVal,
                replyText,
                time: getCurrentTimeStr()
            };

            if (existingIdx >= 0) {
                notice.responses[existingIdx] = respObj;
            } else {
                notice.responses.push(respObj);
            }

            logAudit(user, 'Special Notice Reply', `"${notice.title}" සඳහා පිළිතුරු යැවීය (${statusVal}): ${replyText}`);
            saveState();
            showToast('ඔබගේ පිළිතුර සහ ක්‍රියාමාර්ගය යවන ලදී!', 'success');
            render();
        }

        // ==========================================
        // 8. DUTY EDITOR (KEY HEADS, PARADE BREAKDOWN & DUTIES)
        // ==========================================
        function loadYesterdaysReport() {
            if (state.report.yesterdayBackup) {
                state.report.parade = { ...state.report.yesterdayBackup.parade };
                state.report.briefing = state.report.yesterdayBackup.briefing;
                if (state.report.yesterdayBackup.keyDutyHeads) {
                    state.report.keyDutyHeads = { ...state.report.yesterdayBackup.keyDutyHeads };
                }
                if (state.report.yesterdayBackup.paradeNominalDetails) {
                    state.report.paradeNominalDetails = [...state.report.yesterdayBackup.paradeNominalDetails];
                }
                showToast('කලින් දවසේ වාර්තා ආකෘතිය Load විය!', 'info');
                render();
            }
        }

        function updateKeyDutyHead(roleKey, userId) {
            state.report.keyDutyHeads[roleKey] = userId;
            render();
        }

        function recalculateParadeTotal() {
            const p = state.report.parade;
            p.total = (p.present || 0) + (p.leave || 0) + (p.duty || 0) + (p.sick || 0) + (p.medicalSick || 0) + (p.course || 0) + (p.attachOut || 0) + (p.attachIn || 0);
        }

        function adjustParadeCount(field, delta) {
            const val = parseInt(state.report.parade[field] || 0, 10) + delta;
            if (val < 0) return;
            state.report.parade[field] = val;
            recalculateParadeTotal();
            render();
        }

        function addParadeNominalDetail() {
            const cat = document.getElementById('pnd-cat-select').value;
            const userId = document.getElementById('pnd-user-select').value;
            const note = document.getElementById('pnd-note-input').value.trim();

            if (!userId) return;

            state.report.paradeNominalDetails.push({
                id: 'pnd_' + Date.now(),
                category: cat,
                userId,
                note
            });
            render();
            showToast(`${cat} සඳහා සාමාජිකයා සටහන් කරන ලදී.`, 'success');
        }

        function removeParadeNominalDetail(id) {
            state.report.paradeNominalDetails = state.report.paradeNominalDetails.filter(item => item.id !== id);
            render();
        }

        function addDutyAssignment() {
            const dutyTypeSelect = document.getElementById('nd-duty-type-select').value;
            const customDutyText = document.getElementById('nd-custom-duty-input').value.trim();
            const dutyType = dutyTypeSelect === 'CUSTOM' ? (customDutyText.toUpperCase() || 'SPECIAL DUTY') : dutyTypeSelect;
            const userId = document.getElementById('nd-user-select').value;
            const shift = document.getElementById('nd-shift-select').value;

            if (!userId) {
                showToast('නිලධාරියෙකු තෝරන්න.', 'warning');
                return;
            }

            state.report.nightDuty.push({
                id: 'nd_' + Date.now(),
                dutyType,
                userId,
                shift
            });
            render();
            showToast(`${dutyType} (${shift}) එක් කරන ලදී.`, 'success');
        }

        function removeNightDutyAssignment(id) {
            state.report.nightDuty = state.report.nightDuty.filter(d => d.id !== id);
            render();
        }

        function saveDailyReportAndShare() {
            const briefingEl = document.getElementById('edit-briefing-textarea');
            if (briefingEl) {
                state.report.briefing = briefingEl.value.trim();
            }

            const user = state.session.user;
            state.report.date = new Date().toISOString().split('T')[0];
            state.report.lastUpdatedBy = `${user.rank} ${user.name} (${user.serviceNo})`;
            state.report.lastUpdatedAt = getCurrentTimeStr();
            state.report.yesterdayBackup = {
                keyDutyHeads: { ...state.report.keyDutyHeads },
                parade: { ...state.report.parade },
                paradeNominalDetails: [...state.report.paradeNominalDetails],
                briefing: state.report.briefing
            };

            logAudit(
                user,
                state.session.mode === 'admin' ? 'Super Admin Portal' : 'Duty Handover QR',
                'දෛනික පෙළපාලි වාර්තාව, Key Duties, Shift Duty සහ Night Briefing යාවත්කාලීන කරන ලදී.'

            saveState();
            showToast('දෛනික වාර්තාව සුරැකිණි!', 'success');
            openWhatsAppPreviewModal();
            render();
        }

        function buildWhatsAppMessage() {
            const r = state.report;
            const p = r.parade;
            const heads = r.keyDutyHeads || {};
            const activeIds = new Set(getActivePersonnel().map(u => u.id));

            const formatHead = (uid) => {
                const u = getUserById(uid);
                return (u && u.status === 'Active') ? `${u.rank} ${u.name} (${u.serviceNo})` : 'Not Assigned';
            };

            const dutyLines = r.nightDuty
                .filter(d => activeIds.has(d.userId))
                .map((d, i) => {
                    const u = getUserById(d.userId);
                    const dName = d.dutyType || d.post || 'DUTY';
                    return `${i + 1}. *${dName}*\n    👤 ${u.rank} ${u.name} (${u.serviceNo} - ${u.branch})\n    🕒 Shift: ${d.shift}`;
                }).join('\n');

            const nominalBreakdownLines = (r.paradeNominalDetails || [])
                .filter(item => activeIds.has(item.userId))
                .map(item => {
                    const u = getUserById(item.userId);
                    return `• *${item.category}:* ${u.rank} ${u.name} (${u.serviceNo})${item.note ? ` - ${item.note}` : ''}`;
                }).join('\n');

            const alertBlock = (r.specialAlert && r.specialAlert.active)
                ? `\n🚨 *විශේෂ හදිසි දැනුම්දීම (${r.specialAlert.title})*\n${r.specialAlert.message}\n━━━━━━━━━━━━━━━━━━━━`
                : '';

            return `*🛡️ ROMS — DAILY PARADE & DUTY BRIEFING*
📅 දිනය: ${r.date}
🏢 ඒකකය: ${r.unitName}
━━━━━━━━━━━━━━━━━━━━
*⭐ ප්‍රධාන රාජකාරි නිලධාරීන් (Key Duties)*
• *DUTY SNCO:* ${formatHead(heads.dutySncoId)}
• *CREW CHIEF:* ${formatHead(heads.crewChiefId)}
• *CD DUTY:* ${formatHead(heads.cdDutyId)}
━━━━━━━━━━━━━━━━━━━━${alertBlock}
*📊 1. පෙළපාලි වාර්තාව (Parade State)*
• මුළු පිරිස (Total): *${p.total}*
• පැමිණි (Present): *${p.present}*
• නිවාඩු (Leave): *${p.leave}*
• වෙනත් රාජකාරි (Duty): *${p.duty}*
• අසනීප (Sick): *${p.sick}*
• වෛද්‍ය අසනීප (Medical Sick): *${p.medicalSick || 0}*
• පාඨමාලා (Course): *${p.course}*
• Attach Out: *${p.attachOut || 0}*
• Attach In: *${p.attachIn || 0}*

        function buildOpsBriefingWhatsAppText() {
            const b = state.report.dailyOpsBriefing;
            const alphaLetters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

            const svcBlock = (!b.svcItems || b.svcItems.length === 0)
                ? '02)  SVC - Nil'
                : `02)  SVC -\n${b.svcItems.map((item, idx) => `${alphaLetters[idx] || (idx + 1)}. ${item}`).join('\n')}`;

            const trgBlock = `3) TRG- ${b.trg || 'Nil'}`;
            const receeBlock = (!b.recee || b.recee.trim().toLowerCase() === 'nil')
                ? '4) RECEE- Nil'
                : `4) RECEE-\n#${b.recee.replace(/^#/, '')}`;
            const vvipBlock = (!b.vvip || b.vvip.trim().toLowerCase() === 'nil')
                ? '5) VVIP Air Movement- Nil'
                : `5) VVIP Air Movement-\n#${b.vvip.replace(/^#/, '')}`;

            const adPlanLines = (b.adPlanItems && b.adPlanItems.length > 0)
                ? b.adPlanItems.map(line => ` ${line}`).join('\n')
                : ' Nil';
            const adPlanBlock = `6) AD plan- ${b.adPlanHeader || ''}\n${adPlanLines}`;

            const notamLines = (b.notamItems && b.notamItems.length > 0)
                ? b.notamItems.map(item => `#${item.replace(/^#/, '')}`).join('\n\n')
                : 'Nil';
            const notamBlock = `7) NOTAM\n${notamLines}`;

            const otherBlock = (b.otherItems && b.otherItems.length > 0)
                ? `\n\n8) Other\n${b.otherItems.map(item => `#${item.replace(/^#/, '')}`).join('\n\n')}`
                : '';

            return `Good evening sir,

Night briefing  ${b.dateLabel}

SD - ${b.sd}
ASO - ${b.aso}

ORP - ${b.orp}

01) Night Watch hrs - ${b.nightWatchUnit}                   ${b.nightWatchTime}

S/By- *${b.nightWatchStandby}*


${svcBlock}


${trgBlock}


${receeBlock}


${vvipBlock}


${adPlanBlock}

${notamBlock}${otherBlock}


Good night sir`;
        }

        function saveNominalMember(editId) {
            const serviceNo = document.getElementById('nr-sno').value.trim().toUpperCase();
            const rank = normalizeRankName(document.getElementById('nr-rank').value);
            const name = document.getElementById('nr-name').value.trim().toUpperCase();
            const branch = normalizeBranchName(document.getElementById('nr-branch').value);
            const pin = document.getElementById('nr-pin').value.trim();
            const whatsapp = document.getElementById('nr-wa').value.trim();
            const phone2 = document.getElementById('nr-p2').value.trim();
            const status = document.getElementById('nr-status').value;

            if (!serviceNo || !name || pin.length !== 4 || isNaN(pin)) {
                showToast('Service No, නම සහ ඉලක්කම් 4ක PIN අංකය අනිවාර්ය වේ.', 'error');
                return;
            }

            const duplicatePin = state.nominalRoll.find(u => u.pin === pin && u.id !== editId);
            if (duplicatePin) {
                showToast(`PIN ${pin} දැනටමත් ${duplicatePin.rank} ${duplicatePin.name} හට භාවිතා වේ.`, 'error');
                return;
            }

            if (editId) {
                const idx = state.nominalRoll.findIndex(u => u.id === editId);
                if (idx >= 0) {
                    state.nominalRoll[idx] = {
                        ...state.nominalRoll[idx],
                        serviceNo, rank, name, branch, pin, phone1: whatsapp, phone2, whatsapp, status
                    };
                    logAudit(state.session.user, 'Nominal Roll', `${rank} ${name} (${serviceNo}) ගේ විස්තර යාවත්කාලීන කළේය (Branch: ${branch}, Status: ${status}).`);
                    showToast('සාමාජික විස්තර යාවත්කාලීන විය!', 'success');
                }
            } else {
                state.nominalRoll.push({
                    id: 'u_' + Date.now(),
                    serviceNo, rank, name, branch, pin, phone1: whatsapp, phone2, whatsapp,
                    role: rank === 'SUPER ADMIN' ? 'admin' : 'officer',
                    status
                });
                logAudit(state.session.user, 'Nominal Roll', `නව සාමාජිකයෙකු එක් කළේය: ${rank} ${name} (${serviceNo}) - ${branch}.`);
                showToast('නව සාමාජිකයා සම්මත Branch & Number පිළිවෙළට එක් විය!', 'success');
            }

            const activeCount = getActivePersonnel().length;
            state.report.parade.total = activeCount;
            if (state.report.parade.present > activeCount) {
                state.report.parade.present = activeCount;
            }

            saveState();
            closeModal();
            render();
        }

        async function executePermanentDeleteMember(userId) {
            const member = getUserById(userId);
            if (!member || member.role === 'admin') return;

            state.nominalRoll = state.nominalRoll.filter(u => u.id !== userId);
            state.seenLogs = state.seenLogs.filter(s => s.userId !== userId);
            state.report.nightDuty = state.report.nightDuty.filter(d => d.userId !== userId);
            state.report.paradeNominalDetails = (state.report.paradeNominalDetails || []).filter(item => item.userId !== userId);

            if (state.report.keyDutyHeads.dutySncoId === userId) state.report.keyDutyHeads.dutySncoId = '';
            if (state.report.keyDutyHeads.crewChiefId === userId) state.report.keyDutyHeads.crewChiefId = '';
            if (state.report.keyDutyHeads.cdDutyId === userId) state.report.keyDutyHeads.cdDutyId = '';

            const activeCount = getActivePersonnel().length;
            state.report.parade.total = activeCount;
            if (state.report.parade.present > activeCount) {
                state.report.parade.present = activeCount;
            }

            const client = getSupabaseClient();
            if (client) {
                await client.from('nominal_roll').delete().eq('id', userId);
            }

            logAudit(state.session.user, 'Nominal Roll Delete', `${member.serviceNo} - ${member.rank} ${member.name} (${member.branch}) පද්ධතියෙන් සම්පූර්ණයෙන්ම මකා දමන ලදී.`);
            saveState();
            closeModal();
            showToast(`${member.rank} ${member.name} සම්පූර්ණයෙන්ම ඉවත් කරන ලදී!`, 'warning');
            render();
        }

                                                        ${isActive ? 'Posting Out' : 'Active'}
                                                    </button>
                                                    <button onclick="confirmPermanentDeleteMember('${u.id}')" class="px-2 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-800 text-[10px] font-bold flex items-center gap-0.5" title="සම්පූර්ණයෙන්ම මකන්න">
                                                        <i data-lucide="trash-2" class="w-3 h-3"></i> මකන්න
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        })()}
                    </div>
                </div>
            `;
        }

        // TAB 6: ADMIN AUDIT LOGS & QR CONTROL
        function renderAdminLogsTab() {
            return `
                <div class="space-y-3.5 fade-in pb-6">
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-xs text-slate-900">QR කේත ආරක්ෂාව (QR Token Control)</h3>
                            <p class="text-[11px] text-slate-500">වත්මන් අනුවාදය: Token v${state.report.qrTokenVersion}.0</p>
                        </div>
                        <button onclick="confirmRotateQRCodes()" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 btn-press">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                            <span>QR අලුත් කරන්න</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-xs text-slate-900 flex items-center gap-1.5">
                                <i data-lucide="activity" class="w-4 h-4 text-blue-600"></i>
                                <span>සම්පූර්ණ පද්ධති පිවිසුම් වාර්තාව (Audit Log)</span>
                            </h3>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">${state.auditLogs.length} Logs</span>
                        </div>
                        <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                            ${state.auditLogs.map(log => {
                                const badgeStyle = log.mode.includes('Duty')
                                    ? 'bg-amber-100 text-amber-900'
                                    : log.mode.includes('Admin') || log.mode.includes('Nominal')
                                        ? 'bg-rose-100 text-rose-800'
                                        : log.mode.includes('Special') || log.mode.includes('ADSO')
                                            ? 'bg-indigo-100 text-indigo-800'
                                            : 'bg-blue-100 text-blue-800';
                                return `
                                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                                        <div class="flex items-center justify-between gap-2 mb-1">
                                            <span class="font-bold text-slate-800">${escapeHTML(log.user)}</span>
                                            <span class="text-[10px] text-slate-500 font-semibold shrink-0">${escapeHTML(log.time)}</span>
                                        </div>
                                        <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded ${badgeStyle} mb-1">${escapeHTML(log.mode)}</span>
                                        <p class="text-[11px] text-slate-600">${escapeHTML(log.action)}</p>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // AUTHENTICATED SHELL + GLOBAL SPECIAL ALERT BANNER
        function renderAuthenticatedApp() {
            const { user, mode } = state.session;
            const canEdit = mode === 'duty' || mode === 'admin';
            const isAdmin = mode === 'admin';
            const alertObj = state.report.specialAlert;

            const unreadSpecialCount = state.specialNotices.filter(n =>
                n.recipientIds.includes(user.id) && !n.responses.some(r => r.userId === user.id)
            ).length;

            const modeBadge = {
                general: { text: 'General QR', cls: 'bg-blue-500/20 text-blue-200 border-blue-400/30' },
                duty: { text: 'Duty QR', cls: 'bg-amber-500/20 text-amber-200 border-amber-400/30' },
                admin: { text: 'Super Admin', cls: 'bg-rose-500/20 text-rose-200 border-rose-400/30' }
            }[mode];

            return `
                <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-[10px] text-blue-400 shrink-0 text-center leading-tight px-1">
                                ${escapeHTML(user.rank)}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-xs truncate">${escapeHTML(user.name)}</span>
                                    <span class="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-blue-600 text-white shrink-0">ROMS</span>
                                </div>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <span class="text-[9px] px-1.5 py-0.2 rounded border ${modeBadge.cls} font-bold">${modeBadge.text}</span>
                                    <span class="text-[10px] text-slate-400">${escapeHTML(user.serviceNo)} • ${escapeHTML(user.branch)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="openQRModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300" title="QR Codes">
                                <i data-lucide="qr-code" class="w-4 h-4"></i>
                            </button>
                            <button onclick="logout()" class="px-2.5 py-2 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 text-xs font-bold flex items-center gap-1">
                                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                                <span>Exit</span>
                            </button>
                        </div>
                    </div>
                </header>

                ${alertObj && alertObj.active ? `
                    <div class="mx-3 mt-3 bg-rose-50 border-2 border-rose-500 rounded-2xl p-3 shadow-sm urgent-alert-box">
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 rounded-xl bg-rose-600 text-white flex items-center justify-center shrink-0 mt-0.5">
                                <i data-lucide="siren" class="w-4 h-4"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-1">
                                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-rose-700">🚨 SPECIAL ALERT • ${escapeHTML(alertObj.time)}</span>
                                    <button onclick="openPostSpecialAlertModal()" class="text-[10px] font-bold text-rose-700 underline">Edit</button>
                                </div>
                                <h4 class="text-xs font-bold text-slate-900 mt-0.5">${escapeHTML(alertObj.title)}</h4>
                                <p class="text-[11px] text-slate-700 mt-0.5 leading-snug">${escapeHTML(alertObj.message)}</p>
                                <div class="text-[10px] text-slate-500 mt-1">පළ කළේ: ${escapeHTML(alertObj.postedBy)}</div>
                            </div>
                        </div>
                    </div>
                ` : ''}

                <main class="flex-1 px-3 pt-3">
                    ${state.activeTab === 'briefing' ? renderBriefingTab() : ''}
                    ${state.activeTab === 'seen' ? renderSeenTab() : ''}
                    ${state.activeTab === 'notices' ? renderSpecialNoticesTab() : ''}
                    ${state.activeTab === 'update' && canEdit ? renderUpdateTab() : ''}
                    ${state.activeTab === 'nominal' && isAdmin ? renderNominalRollTab() : ''}
                    ${state.activeTab === 'admin' && isAdmin ? renderAdminLogsTab() : ''}
                </main>

                ${renderIdentityFooter()}

                <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[500px] bg-white border-t border-slate-200 px-1.5 py-1.5 flex items-center justify-around z-30 shadow-[0_-4px_15px_rgba(0,0,0,0.06)]">
                    <button onclick="switchTab('briefing')" class="flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'briefing' ? 'text-blue-600 font-bold bg-blue-50' : 'text-slate-500 font-medium'}">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        <span class="text-[10px]">වාර්තාව</span>
                    </button>

                    <button onclick="switchTab('seen')" class="flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'seen' ? 'text-emerald-700 font-bold bg-emerald-50' : 'text-slate-500 font-medium'}">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                        <span class="text-[10px]">බැලූ අය</span>
                    </button>

                    <button onclick="switchTab('notices')" class="relative flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'notices' ? 'text-indigo-700 font-bold bg-indigo-50' : 'text-slate-500 font-medium'}">
                        <i data-lucide="mail-warning" class="w-4 h-4"></i>
                        <span class="text-[10px]">විශේෂ පණිවිඩ</span>
                        ${unreadSpecialCount > 0 ? `<span class="absolute top-1 right-3 w-4 h-4 rounded-full bg-rose-600 text-white text-[9px] font-bold flex items-center justify-center">${unreadSpecialCount}</span>` : ''}
                    </button>

                    ${canEdit ? `
                        <button onclick="switchTab('update')" class="flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'update' ? 'text-amber-700 font-bold bg-amber-50' : 'text-slate-500 font-medium'}">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                            <span class="text-[10px]">Update</span>
                        </button>
                    ` : ''}

                    ${isAdmin ? `
                        <button onclick="switchTab('nominal')" class="flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'nominal' ? 'text-blue-800 font-bold bg-blue-100/70' : 'text-slate-500 font-medium'}">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            <span class="text-[10px]">Nominal</span>
                        </button>
                        <button onclick="switchTab('admin')" class="flex-1 py-1.5 flex flex-col items-center gap-0.5 rounded-xl transition ${state.activeTab === 'admin' ? 'text-rose-700 font-bold bg-rose-50' : 'text-slate-500 font-medium'}">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                            <span class="text-[10px]">Logs</span>
                        </button>
                    ` : ''}
                </nav>
            `;
        }

        function switchTab(tab) {
            state.activeTab = tab;
            render();
        }

        function render() {
            const appEl = document.getElementById('app');
            if (!state.session) {
                appEl.innerHTML = renderLoginScreen();
            } else {
                appEl.innerHTML = renderAuthenticatedApp();
            }
            lucide.createIcons();
        }

        // Start App, Pull Cloud Data First, and Enable Live Sync
        render();
        pullInitialCloudState(true);
        setupRealtimeSubscription();
    </script>
</body>
</html>
